<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FC;--card:#fff;--tx:#0F172A;--mut:#6B7694;--bd:#E4E9F5;--pri:#4F6BFF;--pri2:#8B5CF6;--sel:#EEF1FF;--sh:0 10px 30px rgba(40,50,120,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#162033;--tx:#E5EAF3;--mut:#94A3B8;--bd:#2A3750;--sel:#1B2B4A}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#162033;--tx:#E5EAF3;--mut:#94A3B8;--bd:#2A3750;--sel:#1B2B4A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{display:flex;flex-direction:column;background:radial-gradient(900px 420px at 90% -8%,rgba(120,110,255,.16),transparent),radial-gradient(700px 360px at -5% 105%,rgba(80,170,255,.12),transparent),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#rooms,#projects,#refs{width:100%;max-width:1100px;margin:0 auto;padding:20px 14px}
main{flex:1;min-height:0;position:relative}
.v{display:none;height:100%;overflow:auto;padding:12px}.v.on{display:flex;flex-direction:column}
#wb{padding:0;overflow:hidden}
.sig{text-align:center;font-size:11px;color:var(--mut);padding:3px;letter-spacing:.04em}
nav{display:flex;gap:4px;background:var(--card);margin:2px 10px 8px;padding:5px;border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 2px;font-size:11px;font-weight:500;cursor:pointer;border-radius:16px;transition:.15s}
nav button.on{color:var(--pri);font-weight:700;background:var(--sel)}
nav b{display:block;font-size:18px}
button,input,select{font:inherit;color:var(--tx)}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;box-shadow:0 4px 14px rgba(91,91,240,.3);transition:.15s}.btn:active{transform:scale(.97)}
.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}.grid .card{transition:.15s}.grid .card:hover{transform:translateY(-3px)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.bar button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;transition:.15s}
.bar button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.dot{width:22px;height:22px;border-radius:50%;padding:0!important;border:2px solid var(--bd)!important}.dot.on{outline:2px solid var(--pri)}
#cw{flex:1;min-height:0;position:relative;background:#fff}
canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2{margin:4px 0 14px;font-size:26px;font-weight:700;letter-spacing:-.02em}
#calc{position:absolute;right:8px;top:56px;width:min(300px,calc(100% - 16px));z-index:5;display:none;box-shadow:0 8px 28px #0004;max-height:calc(100% - 64px);overflow:auto}
#calc.on{display:block}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.keys button{padding:9px 0;border:1px solid var(--bd);background:var(--bg);border-radius:8px;cursor:pointer}
.keys .op{background:var(--sel);color:var(--pri)}
#disp{width:100%;font-size:20px;text-align:right}
.res{font-weight:700;color:var(--pri);margin-top:6px;min-height:20px}
.tag{font-size:11px;font-weight:600;background:var(--sel);color:var(--pri);border-radius:99px;padding:3px 9px}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-weight:700}
.av.sp{outline:3px solid #10B981}
.msg{max-width:80%;padding:7px 10px;border-radius:12px;background:var(--bg);margin:4px 0;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;align-self:flex-end}
.im{width:100%;border-radius:8px;display:block}
</style></head><body>
<main>
<section id="wb" class="v on">
 <div class="bar">
  <input id="title" style="width:130px" aria-label="Board title">
  <span id="live" class="tag" style="display:none">● Live</span>
  <button id="bu" title="Undo">↶</button><button id="br" title="Redo">↷</button>
  <button id="gt" class="on">▦ Grid: On</button><label class="tag" title="Page colour" style="padding:4px 6px">🎨 <input type="color" id="pc" value="#ffffff" style="width:28px;height:22px;padding:0;border:0;vertical-align:middle;background:none"></label><select id="gr"><option value="math">Math Grid</option><option value="blank">Blank</option><option value="dot">Dotted</option><option value="rule">Ruled Lines</option></select>
  <button id="bs">💾 Save</button><button id="bc">🗑 Clear</button><button id="bk">🧮 Calc</button><button id="zo" title="Zoom out">−</button><button id="zl" title="Reset view">100%</button><button id="zi" title="Zoom in">+</button><button id="pu" title="Previous page">▲</button><span id="pg" class="tag">Page 1</span><button id="pd" title="Next page">▼</button>
 </div>
 <div class="bar" id="tools"></div>
 <div class="bar" id="opts"></div>
 <div id="cw"><canvas id="cv"></canvas>
  <div id="calc" class="card">
   <div class="row" id="cm"></div><div id="cb"></div>
  </div>
 </div>
</section>

<section id="rooms" class="v"></section>

<section id="projects" class="v">
 <h2>Projects</h2>
 <div class="row card" style="margin-bottom:10px"><input id="pt" placeholder="Project Name (e.g. Calculus Practice)" style="flex:1"><input id="ps" placeholder="Subject" style="width:110px"><button class="btn" id="pn">+ New Project</button></div>
 <input id="pq" placeholder="Search projects, formulas &amp; notes..." style="margin-bottom:10px">
 <div class="grid" id="pl"></div>
</section>

<section id="refs" class="v">
 <h2>Reference Diagrams</h2>
 <div class="grid" id="rl"></div>
</section>
</main>
<div class="sig">StudySpace • Created by Usman Ahmed</div>
<nav id="nav"></nav>

function shape(i){const{x1,y1,x2,y2}=i;c.beginPath();

function ev(s){s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi');let p=0;
 const ws=()=>{while(s[p]==' ')p++};
 const E=()=>{let x=Tm();for(;;){ws();if(s[p]=='+'){p++;x+=Tm()}else if(s[p]=='-'){p++;x-=Tm()}else return x}};
 const Tm=()=>{let x=F();for(;;){ws();if(s[p]=='*'){p++;x*=F()}else if(s[p]=='/'){p++;const d=F();if(!d)throw 1;x/=d}else if(s[p]=='%'){p++;x%=F()}else return x}};
 const F=()=>{ws();if(s[p]=='+'){p++;return F()}if(s[p]=='-'){p++;return-F()}let x;
  if(s[p]=='('){p++;x=E();ws();if(s[p]==')')p++}
  else if(/[\d.]/.test(s[p]||'')){const m=/^[\d.]+/.exec(s.slice(p))[0];p+=m.length;x=parseFloat(m)}
  else if(/[a-z]/.test(s[p]||'')){const m=/^[a-z]+/.exec(s.slice(p))[0];p+=m.length;
   if(m=='pi')x=Math.PI;else if(m=='e')x=Math.E;else{const a=F(),r=Math.PI/180,f={sqrt:Math.sqrt,sin:v=>Math.sin(v*r),cos:v=>Math.cos(v*r),tan:v=>Math.tan(v*r),log:Math.log10,ln:Math.log}[m];if(!f)throw 1;x=f(a)}}
  else throw 1;
  ws();if(s[p]=='^'){p++;x=Math.pow(x,F())}return x};
 const r=E();ws();if(p<s.length)throw 1;return r}

 else if(x.c&&pc){if(pc.remoteDescription)pc.addIceCandidate(x.c).catch(()=>{});else pc.q.push(x.c)}}
function peersChanged(){drawTiles();if(!RM)return;const P=RM.peers(),m=me();P.forEach(p=>{if(!p.isMe&&!pcs[p.peer]&&m<p.peer)call(p.peer)});Object.keys(pcs).forEach(k=>{if(!P.some(p=>p.peer==k)){pcs[k].close();delete pcs[k];delete tiles[k]}})}
function drawTiles(){const g=$('#vg');if(!g)return;const P=RM?RM.peers():[];
 g.innerHTML=P.map(p=>`<div class="card" style="padding:6px;text-align:center"><div data-v="${p.peer}" style="aspect-ratio:4/3;border-radius:12px;background:var(--sel);display:grid;place-items:center;overflow:hidden"><span class="av" style="background:#4F6BFF">${esc(((p.presence||{}).n||'G')[0].toUpperCase())}</span></div><small>${esc((p.presence||{}).n||'Guest')}${p.isMe?' (You)':''}</small></div>`).join('');
 P.forEach(p=>{const s=p.isMe?stream:tiles[p.peer],d=g.querySelector('[data-v="'+p.peer+'"]');if(s&&d){const v=document.createElement('video');v.autoplay=v.playsInline=true;v.muted=!!p.isMe;v.srcObject=s;if(s.getVideoTracks().length){v.style.cssText='width:100%;height:100%;object-fit:cover';d.innerHTML=''}else v.style.display='none';d.appendChild(v)}});
 $('#ms2').textContent=(RM?P.length+' in room':'Live connection unavailable — offline room')+(stream?'':' • camera/mic not available')}
function renderRooms(){const el=$('#rooms'),r=S.room;
 if(!r){el.innerHTML=`<h2>Study Rooms</h2>${DB?'':'<div class="card" style="margin-bottom:10px">Live rooms need a signed-in claude.ai viewer. Offline mode: board and chat stay on this device.</div>'}
 <div class="card row" style="margin-bottom:10px"><input id="nm" placeholder="Your name" value="${esc(NAME)}" style="width:140px"><input id="jc" placeholder="Room code (e.g. PHYS-101)" style="flex:1"><button class="btn" id="jb">Join Room</button></div>
 <div class="card row" style="margin-bottom:10px"><input id="nt" placeholder="Room Topic / Name" style="flex:1"><input id="ns" placeholder="Subject" style="width:110px"><button class="btn" id="nb">Create &amp; Join</button></div>
 <div class="grid">${LIST.length?LIST.map(x=>`<div class="card"><b>${esc(x.title||'Room')}</b> <span class="tag">${esc(x.code)}</span><p style="color:var(--mut);margin:6px 0">${esc(x.subject||'')} • Host: ${esc(x.host||'')}</p><button class="btn" data-j="${esc(x.code)}" data-t="${esc(x.title||'')}">Join</button></div>`).join(''):'<p style="color:var(--mut)">No rooms yet. Create the first one.</p>'}</div>`;
  const nm=()=>{NAME=$('#nm').value.trim()||'Guest';save('ss_name',NAME)};
  $('#jb').onclick=()=>{nm();const c=$('#jc').value.trim().toUpperCase();if(c)enter(c,(LIST.find(x=>x.code==c)||{}).title||'Study Room ('+c+')')};
  $('#nb').onclick=()=>{nm();const t=$('#nt').value.trim()||'New Room',s=$('#ns').value.trim()||'General',c=s.slice(0,4).toUpperCase()+'-'+(100+Math.floor(Math.random()*900));if(DB)DB.doc('meta/'+c).set({title:t,subject:s,host:NAME,t:Date.now()}).catch(()=>{});enter(c,t)};
  el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{nm();enter(b.dataset.j,b.dataset.t)});return}
 el.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(r.title)} <span class="tag">${esc(r.code)}</span></h2><div class="row"><button class="btn" id="ob">✏️ Room Board</button><button class="btn ghost" id="lv">Leave</button></div></div>
 <div class="row" style="align-items:flex-start"><div class="card" style="flex:1 1 300px"><div id="vg" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))"></div><div class="row" style="margin-top:10px;justify-content:center"><button class="btn ghost" id="tm">${mic?'🎤 Mic':'🔇 Muted'}</button><button class="btn ghost" id="tc">${camOn?'📷 Camera':'🚫 Cam off'}</button></div><p id="ms2" style="color:var(--mut);font-size:12px;margin:8px 0 0"></p></div>
 <div class="card" style="flex:1 1 300px;display:flex;flex-direction:column"><b>Chat</b><div id="ch" style="display:flex;flex-direction:column;height:260px;overflow:auto"></div><div class="row" style="margin-top:8px"><input id="mi" placeholder="Type a message..." style="flex:1"><button class="btn" id="ms">Send</button></div></div></div>`;
 $('#ob').onclick=()=>go('wb');$('#lv').onclick=()=>leaveRoom();$('#ms').onclick=send;$('#mi').onkeydown=e=>{if(e.key=='Enter')send()};
 $('#tm').onclick=()=>{mic=!mic;stream&&stream.getAudioTracks().forEach(t=>t.enabled=mic);$('#tm').textContent=mic?'🎤 Mic':'🔇 Muted'};
 $('#tc').onclick=()=>{camOn=!camOn;stream&&stream.getVideoTracks().forEach(t=>t.enabled=camOn);$('#tc').textContent=camOn?'📷 Camera':'🚫 Cam off'};
 drawChat();drawTiles()}

/* ---------- projects & references ---------- */
function renderProjects(){const q=$('#pq').value.toLowerCase(),l=P.filter(p=>(p.title+p.subject).toLowerCase().includes(q));
 $('#pl').innerHTML=l.length?l.map(p=>`<div class="card"><b>${esc(p.title)}</b><p style="color:var(--mut);margin:6px 0"><span class="tag">${esc(p.subject)}</span> ${p.date}</p><div class="row"><button class="btn" data-o="${p.id}">Open in Whiteboard</button><button class="btn ghost" data-d="${p.id}">Delete</button></div></div>`).join(''):'<p style="color:var(--mut)">No projects found</p>';
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const p=P.find(x=>x.id==b.dataset.o);openBoard(p.title,p.items,p.grid,p.cam,p)});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{P=P.filter(x=>x.id!=b.dataset.d);save('ss_projects',P);renderProjects()})}
$('#pq').oninput=renderProjects;
$('#pn').onclick=()=>{const t=$('#pt').value.trim();if(!t)return;const p={id:'p'+Date.now(),title:t,subject:$('#ps').value.trim()||'General',date:today(),items:[],grid:'math'};P.unshift(p);save('ss_projects',P);$('#pt').value='';openBoard(p.title,[],'math')};
$('#rl').innerHTML=REFS.map(r=>`<div class="card"><img class="im" src="${IMG[r.k]}" alt="${r.t}"><b style="display:block;margin-top:8px">${r.t}</b><p style="color:var(--mut);margin:4px 0">${r.d}</p><div class="row" style="margin-bottom:8px">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="btn" data-r="${r.id}">Insert to Whiteboard</button></div>`).join('');
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{addImg(REFS.find(x=>x.id==b.dataset.r));go('wb')});

$('#title').value=S.title;sync();btns();go('rooms');
</script></body></html>
